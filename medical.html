<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>医疗合作 - 星荧科技</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header light" data-header></header>
    <main>
      <section class="inner-hero medical-hero">
        <img src="./assets/medical/hero-bg.png" alt="" />
        <div class="inner-hero-copy light">
          <h1>医疗合作</h1>
          <p>携手临床机构　推动智能康复发展</p>
          <div class="accent-line"></div>
          <span>与医疗机构共同开展产品验证与临床应用探索</span>
        </div>
      </section>

      <section class="partners section">
        <div class="section-title">
          <h2>合作医疗机构</h2>
          <p>已与多家医疗机构开展合作与验证</p>
        </div>
        <img src="./assets/medical/partners.png" alt="合作医疗机构" />
      </section>

      <section class="validation section muted">
        <div class="section-title">
          <h2>临床验证</h2>
          <p>通过真实场景验证产品性能与使用体验</p>
        </div>
        <div class="four-grid">
          <article><img src="./assets/medical/doctor-guidance.png" alt="" /><h3>医生指导</h3></article>
          <article><img src="./assets/medical/patient-training.png" alt="" /><h3>患者训练</h3></article>
          <article><img src="./assets/medical/device-testing.png" alt="" /><h3>设备测试</h3></article>
          <article><img src="./assets/medical/data-collection.png" alt="" /><h3>数据采集</h3></article>
        </div>
      </section>

      <section class="outcomes section muted-dark">
        <div class="section-title">
          <h2>合作成果</h2>
          <p>持续推动智能康复技术落地应用</p>
        </div>
        <div class="outcome-grid">
          <article class="metric-card"><img src="./assets/medical/outcome-hospital.png" alt="" /><div><strong>7+</strong><span>合作医院</span></div></article>
          <article class="metric-card"><img src="./assets/medical/outcome-cases.png" alt="" /><div><strong>100+</strong><span>验证案例</span></div></article>
          <article class="metric-card"><img src="./assets/medical/outcome-hours.png" alt="" /><div><strong>500h+</strong><span>训练时长</span></div></article>
          <article class="metric-card"><img src="./assets/medical/outcome-data.png" alt="" /><div><strong>10000+</strong><span>数据记录</span></div></article>
          <article class="result-card"><img src="./assets/medical/outcome-validate.png" alt="" /><div><strong>临床验证支持</strong><span>真实场景验证</span></div></article>
          <article class="result-card"><img src="./assets/medical/outcome-optimize.png" alt="" /><div><strong>产品持续优化</strong><span>临床反馈迭代</span></div></article>
          <article class="result-card"><img src="./assets/medical/outcome-innovation.png" alt="" /><div><strong>数据驱动创新</strong><span>训练数据赋能</span></div></article>
          <article class="result-card"><img src="./assets/medical/outcome-research.png" alt="" /><div><strong>产学研协同</strong><span>医企联合创新</span></div></article>
        </div>
      </section>

      <section class="cta-band medical-cta">
        <h2>携手推动康复技术创新</h2>
        <p>欢迎医疗机构、科研院所及行业伙伴与我们建立联系，共同探索智能康复技术创新应用</p>
        <div class="cta-actions">
          <a href="#">下载资料</a>
          <a href="./contact.html">联系我们</a>
        </div>
      </section>
    </main>
    <footer class="site-footer"></footer>
    <script src="./app.js"></script>
  </body>
</html>
