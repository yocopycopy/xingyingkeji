<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>下载中心 - 星荧科技</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header light" data-header></header>
    <main class="downloads-page">
      <section class="downloads-hero">
        <div>
          <h1>下载中心</h1>
          <p>获取产品资料与技术文档</p>
        </div>
      </section>

      <section class="downloads-shell">
        <aside class="downloads-tabs" aria-label="下载分类">
          <button class="active" type="button" data-download-tab="rehab">下肢康复训练机器人</button>
          <button type="button" data-download-tab="osa">OSA睡眠枕</button>
        </aside>

        <div class="downloads-panel active" data-download-panel="rehab">
          <a class="download-row" href="#">
            <span>下肢康复训练机器人家庭版产品手册彩页</span>
            <small>PDF · V1.0</small>
            <i aria-hidden="true"></i>
          </a>
          <a class="download-row" href="#">
            <span>下肢康复训练机器人医用版产品手册彩页</span>
            <small>PDF · V1.0</small>
            <i aria-hidden="true"></i>
          </a>
        </div>

        <div class="downloads-panel" data-download-panel="osa">
          <a class="download-row" href="#">
            <span>OSA睡眠枕产品手册彩页</span>
            <small>PDF · V1.0</small>
            <i aria-hidden="true"></i>
          </a>
          <a class="download-row" href="#">
            <span>OSA睡眠枕技术文档</span>
            <small>PDF · V1.0</small>
            <i aria-hidden="true"></i>
          </a>
        </div>
      </section>
    </main>
    <footer class="site-footer"></footer>
    <script src="./app.js"></script>
  </body>
</html>
