<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>星荧科技 STΛRLIGHT</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body class="page-home">
    <header class="site-header dark" data-header data-scroll-threshold="120" data-scroll-reset-threshold="96"></header>

    <main>
      <section class="video-hero">
        <video src="./assets/home/hero-video.mp4" autoplay muted loop playsinline></video>
        <div class="video-fallback">视频</div>
      </section>

      <section class="feature-hero product-spotlight">
        <img class="hero-bg" src="./assets/home/medical-bg.png" alt="" />
        <div class="feature-copy light">
          <p>医疗机构适用</p>
          <h1>下肢康复训练机器人</h1>
          <div class="accent-line"></div>
          <p class="lead">智驭康复、步向新生</p>
          <a class="text-link" href="./product-medical.html">了解更多</a>
        </div>
        <img class="spotlight-product" src="./assets/home/medical-product.png" alt="下肢康复训练机器人医用版" />
      </section>

      <section class="partners section">
        <div class="section-title">
          <h2>合作伙伴</h2>
          <p>联合临床与科研，推动医疗创新</p>
        </div>
        <img src="./assets/home/partners.png" alt="合作伙伴机构" />
      </section>

      <section class="scenes section muted">
        <div class="section-title">
          <h2>应用场景</h2>
          <p>覆盖医疗机构、家庭康复，满足多元康复需求</p>
        </div>
        <div class="scene-grid">
          <article>
            <img src="./assets/home/scene-medical.png" alt="医疗康复场景" />
            <h3>智能康复高效协同医疗场景</h3>
          </article>
          <article>
            <img src="./assets/home/scene-home.png" alt="家庭康复场景" />
            <h3>家庭智能康复训练场景</h3>
          </article>
        </div>
      </section>

      <section class="quick-actions muted">
        <a class="action-card" href="./trial.html">
          <img src="./assets/home/action-trial.png" alt="" />
          <span>预约体验</span>
        </a>
        <a class="action-card" href="./placeholder.html?feature=shop">
          <img src="./assets/home/action-shop.png" alt="" />
          <span>线上商城</span>
        </a>
        <a class="action-card" href="./contact.html">
          <img src="./assets/home/action-contact.png" alt="" />
          <span>联系我们</span>
        </a>
      </section>
    </main>

    <footer class="site-footer"></footer>
    <script src="./app.js"></script>
